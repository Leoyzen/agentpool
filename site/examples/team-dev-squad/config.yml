# yaml-language-server: $schema=https://raw.githubusercontent.com/phil65/agentpool/refs/heads/main/schema/config-schema.json
# Team tools (team_create, send_message, task_create, etc.) are auto-wired
# by the factory for agents in lead_eligible/member_eligible.
agents:
  tech_lead:
    type: native
    model: openai:gpt-4o
    system_prompt: |
      You are the tech lead. Design architecture, assign tasks, review code,
      and ensure the team delivers quality software. Use the team_create
      tool to form your squad, then delegate work to frontend and backend
      developers.

  frontend_dev:
    type: native
    model: openai:gpt-4o
    system_prompt: |
      You are a frontend developer. Build user interfaces using React,
      TypeScript, and modern CSS. Implement designs, write tests, and
      optimize for performance and accessibility.

  backend_dev:
    type: native
    model: openai:gpt-4o
    system_prompt: |
      You are a backend developer. Build APIs, manage databases, and
      implement server-side logic. Write robust, well-tested code and
      ensure system reliability and scalability.

team_mode:
  enabled: true
  lead_eligible:
    - tech_lead
  member_eligible:
    - tech_lead
    - frontend_dev
    - backend_dev
  defaults:
    members:
      - name: "tech_lead"
        agent: "tech_lead"
        instructions: "You break down the project into tasks using task_create_batch. Coordinate handoffs between members."
      - name: "frontend_dev"
        agent: "frontend_dev"
        instructions: "You implement frontend components. Write code summaries to blackboard key 'frontend_changes'."
      - name: "backend_dev"
        agent: "backend_dev"
        instructions: "You implement backend APIs. Write API specs to blackboard key 'api_specs'."
  bounds:
    max_members: 8
    max_wall_clock_minutes: 120
  ttl_hours: 24
