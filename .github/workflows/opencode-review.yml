name: OpenCode PR Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
        type: string

# Non-blocking: posts a review comment, does not block merge
# - pull_request: auto-triggers for same-repo PRs (fork PRs lack secret access)
# - issue_comment: manual trigger via /oc or /opencode on any PR or issue
# - workflow_dispatch: manual trigger from Actions UI
permissions:
  id-token: write
  contents: read
  pull-requests: write
  issues: write

concurrency:
  # One group per PR across all three trigger paths; new run cancels stale review run
  group: opencode-review-${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    if: |
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false
      ) || (
        github.event_name == 'issue_comment' &&
        github.event.comment.user.type != 'Bot' && (
          contains(github.event.comment.body, '/oc') ||
          contains(github.event.comment.body, '/opencode')
        )
      ) || (
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest

    steps:
      - name: Determine PR ref
        id: pr_ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Resolve the PR number across all three trigger paths:
          # - pull_request: event payload has the number directly
          # - issue_comment: gh must resolve because comment may be on a PR or issue
          # - workflow_dispatch: from the (required) pr_number input
          # The runner workspace has no git repo on issue_comment / workflow_dispatch
          # runs that skip the pull_request event, so gh needs -R to identify the repo.
          case "${{ github.event_name }}" in
            pull_request)
              PR_NUMBER="${{ github.event.pull_request.number }}"
              ;;
            issue_comment)
              PR_NUMBER="${{ github.event.issue.number }}"
              ;;
            workflow_dispatch)
              PR_NUMBER="${{ github.event.inputs.pr_number }}"
              ;;
          esac
          if [ -z "$PR_NUMBER" ]; then
            echo "::error::Could not determine PR number for ${{ github.event_name }}"
            exit 1
          fi
          REF=$(gh pr view -R "${{ github.repository }}" "$PR_NUMBER" --json headRefOid --jq '.headRefOid')
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Checked out PR #$PR_NUMBER at $REF"

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.pr_ref.outputs.ref }}

      - name: Run OpenCode review
        uses: anomalyco/opencode/github@latest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        with:
          agent: review-lead
          model: deepseek/deepseek-v4-flash
          prompt: |
            Review this pull request. Read the AGENTS.md file first for project
            conventions, then analyze the diff and delegate to your specialist
            subagents as appropriate. Post your synthesized review as a comment.

            The PR thread is included as context (in <pull_request_comments> and
            <pull_request_reviews>). It contains ALL previous comments and reviews
            on this PR, including reviews from earlier runs of this bot.

            DEDUPLICATION REQUIREMENT:
            - Before reporting any finding, check whether that exact issue was
              already reported in <pull_request_comments> or <pull_request_reviews>.
            - Do NOT repeat findings that were already reported. Never restate an
              existing comment.
            - For each previously reported issue, only mention it again if its
              status changed (e.g. was FIXED or REGRESSED since the last review).
              Otherwise omit it entirely.
            - Only raise NEW issues or issues whose status has changed.
            - If nothing new to report, post exactly: "No new issues — see the
              previous review comment."

            Focus areas:
            - Code: type safety, testing, telemetry, architecture consistency
            - Docs: AGENTS.md context loading table, subsystem AGENTS.md,
              docs/explanation/ coverage, link integrity
