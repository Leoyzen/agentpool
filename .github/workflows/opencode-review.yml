name: OpenCode PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Non-blocking: posts a review comment, does not block merge
permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: opencode-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip draft PRs — only review when marked ready
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run OpenCode review
        uses: anomalyco/opencode/github@latest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Use the orchestrator agent that delegates to review-code and review-docs
          agent: review-lead
          model: anthropic/claude-sonnet-4-20250514
          use_github_token: true
          prompt: |
            Review this pull request. Read the AGENTS.md file first for project
            conventions, then analyze the diff and delegate to your specialist
            subagents as appropriate. Post your synthesized review as a comment.

            Context:
            - Branch: ${{ github.event.pull_request.head.ref }}
            - Title: ${{ github.event.pull_request.title }}
            - Changed files: review the git diff for this PR

            Focus areas:
            - Code: type safety, testing, telemetry, architecture consistency
            - Docs: AGENTS.md context loading table, subsystem AGENTS.md,
              docs/explanation/ coverage, link integrity
