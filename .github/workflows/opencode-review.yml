name: OpenCode PR Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

# Non-blocking: posts a review comment, does not block merge
# Uses pull_request_target so fork PRs also trigger review with access to repo secrets.
# The workflow runs in the base repo's security context, but we explicitly checkout
# the PR head SHA to ensure we review the PR's actual code, not the base branch.
permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: opencode-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip draft PRs only — fork PRs are supported via pull_request_target
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Run OpenCode review
        uses: anomalyco/opencode/github@latest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.REVIEW_GITHUB_TOKEN }}
        with:
          # Use the orchestrator agent that delegates to review-code and review-docs
          agent: review-lead
          model: deepseek/deepseek-v4-flash
          use_github_token: true
          prompt: |
            Review this pull request. Read the AGENTS.md file first for project
            conventions, then analyze the diff and delegate to your specialist
            subagents as appropriate. Post your synthesized review as a comment.

            Context:
            - Branch: ${{ github.event.pull_request.head.ref }}
            - Title: ${{ github.event.pull_request.title }}
            - Changed files: review the git diff for this PR

            Focus areas:
            - Code: type safety, testing, telemetry, architecture consistency
            - Docs: AGENTS.md context loading table, subsystem AGENTS.md,
              docs/explanation/ coverage, link integrity
