name: OpenCode PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
        type: string

# Non-blocking: posts a review comment, does not block merge
# - pull_request: auto-triggers for same-repo PRs (fork PRs lack secret access)
# - issue_comment: manual trigger via /oc or /opencode comment on any PR
# - workflow_dispatch: manual trigger from Actions UI
permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: opencode-review-${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    if: |
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false
      ) || (
        github.event_name == 'issue_comment' &&
        contains(github.event.issue.pull_request_url, 'pull') && (
          contains(github.event.comment.body, '/oc') ||
          contains(github.event.comment.body, '/opencode')
        )
      ) || (
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run OpenCode review
        uses: anomalyco/opencode/github@latest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.REVIEW_GITHUB_TOKEN }}
        with:
          agent: review-lead
          model: deepseek/deepseek-v4-flash
          use_github_token: true
          prompt: |
            Review this pull request. Read the AGENTS.md file first for project
            conventions, then analyze the diff and delegate to your specialist
            subagents as appropriate. Post your synthesized review as a comment.

            Focus areas:
            - Code: type safety, testing, telemetry, architecture consistency
            - Docs: AGENTS.md context loading table, subsystem AGENTS.md,
              docs/explanation/ coverage, link integrity
